name: Commits vers Discord

on:
  push:
    branches: ['**']

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Poster les commits dans #commits
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_COMMITS }}
        shell: python3 {0}
        run: |
          import json, os, urllib.request
          url = os.environ.get("WEBHOOK", "").strip()
          if url.endswith("/github"):
              url = url[: -len("/github")]
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          commits = ev.get("commits") or []
          if not url or not commits:
              print("Rien à envoyer (secret absent ou aucun commit)")
              raise SystemExit(0)
          branche = ev["ref"].removeprefix("refs/heads/")
          blocs = [f"[`{c['id'][:7]}`]({c['url']}) **{c['author']['name']}**\n{c['message'].strip()}" for c in commits]
          texte = "\n\n".join(blocs)
          if len(texte) > 4000:
              texte = texte[:4000] + "\n…"
          payload = {
              "username": "GitHub",
              "embeds": [{
                  "title": f"{ev['repository']['name']} · {branche} · {len(commits)} commit(s)",
                  "url": ev.get("compare"),
                  "description": texte,
                  "color": 3447003,
                  "footer": {"text": f"poussé par {ev['pusher']['name']}"},
              }],
          }
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json", "User-Agent": "akumon-commits"})
          urllib.request.urlopen(req).read()
          print("Envoyé")
